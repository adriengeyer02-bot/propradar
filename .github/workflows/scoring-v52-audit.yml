name: V5.2 audit invariants
on:
  pull_request:
    paths:
      - 'SCORING_V5_2.md'
      - 'app/data/scoring-v52-**'
      - 'app/lib/scoringV52**'
      - 'app/lib/firmUpdates.ts'
      - 'app/lib/scoreBreakdown.ts'
      - 'app/lib/ruleAmountDisplay.ts'
      - 'app/lib/scoreRuleCopy.ts'
      - 'app/lib/scoreV5I18n.ts'
      - 'app/lib/propFirms.ts'
      - 'app/components/ui/ScoreBreakdownDialog.tsx'
      - 'app/[locale]/firm/[slug]/page.tsx'
      - 'scripts/*scoring-v52*'
      - 'scripts/check-score-modal-consistency.mjs'
      - 'package.json'
      - '.github/workflows/scoring-v52-audit.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:scoring-v52
      - run: npm run check:score-modal
      - run: npx tsc --noEmit -p .
